spring.application.name=customer-rewards-service
server.port=8080

# --- Database: HSQLDB in-memory database auto-configured by Spring Boot (no URL needed).
# --- schema.sql and data.sql are executed on every startup; data is lost on shutdown.
spring.sql.init.mode=embedded

# --- Cache: Caffeine, entries expire 10 minutes after being written ---
spring.cache.type=caffeine
spring.cache.cache-names=customerRewards,allRewards
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# --- Swagger UI / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,caches

# --- Logging ---
logging.level.com.customer.rewards=INFO
